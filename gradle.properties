# AGP 8.11 + lint needs more than the default; the walking skeleton build
# exhausted 512m/256m while compiling the second variant's unit tests.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true

kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
